[project]
name = "sendsure_erpnext"
authors = [{ name = "SendSure" }]
description = "Pay suppliers in USDC on Arc with SendSure, only at an address they proved, recorded back exactly."
requires-python = ">=3.10"
license = { file = "license.txt" }
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"
