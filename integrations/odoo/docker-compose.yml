# Odoo 19 Community + Postgres with the SendSure add-on, for trying it and for the tests.
#   docker compose up -d        Odoo on http://127.0.0.1:18069 (login admin / admin), database "sendsure"
#   docker compose down -v      remove everything
name: sendsure-odoo
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes: [db:/var/lib/postgresql/data]
  odoo:
    image: odoo:19
    depends_on: [db]
    ports: ["127.0.0.1:18069:8069"]
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - ./:/mnt/extra-addons:ro
    command: ["odoo", "-d", "sendsure", "-i", "account,sendsure_payables"]
volumes:
  db:
